services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: skin-api:latest
    container_name: skin-api-container
    ports:
      - "8000:8000"
    volumes:
      # Host ./models folder (not in git) mounted read-only into the container
      - ./models:/app/models:ro
    environment:
      # Real checkpoint path inside the container. Remove this line to run in dummy mode.
      - MODEL_PATH=/app/models/efficientnet_b0_best.pt
    # If the checkpoint is missing or broken the app exits; retry a few times, then stop.
    restart: on-failure:3
    # The health check is defined in the Dockerfile (HEALTHCHECK).