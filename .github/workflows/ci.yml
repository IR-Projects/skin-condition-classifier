name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with ruff
      run: ruff check .

    - name: Test with pytest
      run: pytest

  docker-build:
    # Runs only if the "test" job succeeds
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t skin-api:test .

    - name: Smoke test the container (dummy mode, no checkpoint)
      run: |
        docker run -d --name skin-api-test -p 8000:8000 skin-api:test
        for i in $(seq 1 30); do
          curl -fsS http://localhost:8000/health && break
          sleep 2
        done
        curl -fsS http://localhost:8000/health | grep '"mode":"dummy"'

    - name: Show container logs on failure
      if: failure()
      run: docker logs skin-api-test || true